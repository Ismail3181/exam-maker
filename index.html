<title>Exam Maker</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f7fd;--card:#fff;--ink:#14202e;--mut:#586a80;--line:#d5e1f0;--acc:#1f6feb;--on:#fff;--ok:#0a7a45;--okb:#e2f4e8;--bad:#b3261e;--badb:#fcebe9;--sel:#e5efff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1520;--card:#151e2b;--ink:#e8eef7;--mut:#98a8bd;--line:#263447;--acc:#6aa5ff;--on:#04101f;--ok:#4cd694;--okb:#10301f;--bad:#ff8a80;--badb:#3a1714;--sel:#162a47;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1520;--card:#151e2b;--ink:#e8eef7;--mut:#98a8bd;--line:#263447;--acc:#6aa5ff;--on:#04101f;--ok:#4cd694;--okb:#10301f;--bad:#ff8a80;--badb:#3a1714;--sel:#162a47;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 'Hind Siliguri','Noto Sans Bengali',system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:32px;margin:8px 0 4px;color:var(--acc);font-weight:700;letter-spacing:.3px}
h3{margin:20px 0 4px}
button{font:inherit;cursor:pointer}
.mut{color:var(--mut);font-size:14px}
textarea{width:100%;min-height:230px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;resize:vertical}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:12px 0}
summary{cursor:pointer;font-weight:600}
pre{white-space:pre-wrap;font:inherit;font-size:14px;margin:8px 0;color:var(--mut)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
label{display:block;font-size:14px;color:var(--mut)}
.grid input,.grid select{display:block;width:100%;margin-top:4px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
.ck{display:flex;gap:8px;align-items:center;margin:6px 0;color:var(--ink);font-size:16px}
.st{font-size:15px;margin:8px 0}
.pri{width:100%;padding:14px;border:0;border-radius:12px;background:var(--acc);color:var(--on);font-weight:600;margin-top:12px}
.pri:disabled{opacity:.4;cursor:not-allowed}
.pri{box-shadow:0 4px 14px rgba(31,111,235,.28)}
textarea:focus,input:focus,select:focus{outline:2px solid var(--acc);border-color:var(--acc)}
.card,details,textarea{box-shadow:0 1px 3px rgba(20,60,120,.06)}
.sec{padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.sec:disabled{opacity:.4}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.tm{font-weight:700;font-size:22px;font-variant-numeric:tabular-nums}
.sp{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
.q{font-weight:600;font-size:18px;margin-bottom:12px}
.opt{display:flex;gap:10px;width:100%;text-align:left;align-items:flex-start;padding:12px;margin:8px 0;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
.opt b{min-width:28px;height:28px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:14px;flex:none}
.opt.sel{border-color:var(--acc);background:var(--sel)}
.opt.sel b{background:var(--acc);color:var(--on)}
.nav{display:flex;gap:10px}.nav>button{flex:1}
.pal{display:none;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px;margin:10px 0}
.pal.on{display:grid}
.pn{padding:8px 0;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.pn.done{background:var(--sel);border-color:var(--acc)}
.pn.cur{outline:2px solid var(--acc)}
.score{text-align:center}
.big{font-size:46px;font-weight:700;color:var(--acc);line-height:1.2}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stats div{background:var(--bg);border-radius:10px;padding:8px}
.rv{border-left:4px solid var(--line)}
.rv.c{border-left-color:var(--ok)}
.rv.w{border-left-color:var(--bad)}
.rv .opt{padding:8px 10px;margin:4px 0}
.opt.ok{background:var(--okb);border-color:var(--ok)}
.opt.bad{background:var(--badb);border-color:var(--bad)}
.warn{color:var(--bad)}
.hide{display:none!important}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
#nav button{flex:1;border:0;background:none;color:var(--mut);padding:8px 0;font-size:12px;line-height:1.3}
#nav button.on{color:var(--acc);font-weight:600}
#nav .i{display:block;font-size:20px}
#setup{padding-bottom:76px}
main{zoom:var(--z,1)}
.tools,.row{display:flex;gap:8px;margin:8px 0}
.row>input,.row>select{flex:1;min-width:0;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
.fl{margin:8px 0}.fl input{display:block;margin-top:4px;max-width:100%;color:var(--ink)}
.star{float:right;border:0;background:none;font-size:26px;color:var(--mut);padding:0 0 0 8px}
.hr{display:flex;justify-content:space-between;gap:8px;padding:4px 0}
.pb{height:6px;background:var(--bg);border-radius:4px}.pb i{display:block;height:100%;background:var(--acc);border-radius:4px}
</style>
</head>

    <div class="row"><button class="sec" id="uz" data-t="ures"></button></div>
    <div class="mut" id="us"></div>

</section>

  <div class="nav"><button class="sec" id="prev" data-t="prev"></button><button class="sec" id="next" data-t="next"></button></div>

function parse(t){
  const qs=[],errs=[];let c=null,m,sub='';
  const push=()=>{
    if(!c)return;
    const i=c.o.length>=2&&c.a!=null?res(c.a,c.o):-1;
    if(i<0)errs.push(c.q.slice(0,30));else qs.push({q:c.q,o:c.o,a:i,e:c.e,t:c.t});
  };
  for(const raw of t.split(/\r?\n/)){
    const l=raw.trim();if(!l)continue;
    if(m=l.match(/^(?:বিষয়|subject|topic)\s*[:：\-–]\s*(.+)$/i)){sub=m[1].trim();continue}
    if(c&&(m=l.match(/^\(?([কখগঘঙA-Ea-e])[\)\.\:।]\s*(.+)$/))){c.o.push(m[2].trim());continue}
    if(c&&(m=l.match(/^(?:সঠিক\s*উত্তর|উত্তর|ans(?:wer)?)\s*[:：\-–]\s*(.+)$/i))){c.a=m[1];continue}
    if(c&&(m=l.match(/^(?:ব্যাখ্যা|explanation)\s*[:：\-–]\s*(.+)$/i))){c.e=m[1];continue}
    const q=l.replace(/^(?:প্রশ্ন|Q(?:uestion)?)?\s*[\d০-৯]*\s*[:：\.\)\-।]\s*/i,'');
    if(!c||c.o.length||c.a!=null){push();c={q:q,o:[],a:null,e:'',t:sub}}else c.q+=' '+q;
  }
  push();
  return {qs,errs};
}
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function prep(qs,sq,so){
  const r=qs.map(q=>{
    if(!so)return {...q};
    const idx=shuf(q.o.map((_,i)=>i));
    return {...q,o:idx.map(i=>q.o[i]),a:idx.indexOf(q.a)};
  });
  return sq?shuf(r):r;
}
const show=id=>{['setup','exam','result'].forEach(x=>$('#'+x).classList.toggle('hide',x!=id));if(id=='setup'){refresh();tab(0)}$('#nav').classList.toggle('hide',id!='setup');scrollTo(0,0)};

function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-t]').forEach(e=>e.textContent=T(e.dataset.t));
  document.querySelectorAll('[data-p]').forEach(e=>e.placeholder=T(e.dataset.p));
  $('#pre').textContent=T('pre');
  const o=$('#neg').options;o[1].text=bn('0.25');o[2].text=bn('0.5');
  $('#lg').value=lang;
}
function upd(){
  const v=$('#src').value,r=parse(v);Q=r.qs;
  let h=Q.length?T('found')(bn(Q.length)):T('noq');
  if(r.errs.length)h+=`<div class="warn">${T('drop')(bn(r.errs.length),r.errs.slice(0,3).map(esc).join('; '))}</div>`;
  $('#st').innerHTML=h;
  $('#go').disabled=!Q.length;
  phMin();
  ls.set(v);
}
function begin(qs,mins,prac){
  S={qs,ans:qs.map(()=>-1),i:0,end:Date.now()+mins*60000,done:0,prac:!!prac,st:new Set()};
  show('exam');$('#cf').classList.add('hide');$('#pal').classList.remove('on');
  if(prac||!mins){$('#tm').textContent=prac?'✎':'∞';$('#tm').classList.remove('warn')}else{tick();S.t=setInterval(tick,1000)}render();
}
function tick(){
  const r=Math.max(0,Math.ceil((S.end-Date.now())/1000));
  const p=n=>bn(String(n).padStart(2,'0'));
  $('#tm').textContent=p(Math.floor(r/60))+':'+p(r%60);
  $('#tm').classList.toggle('warn',r<60);
  if(!r)finish();
}
function render(){
  const q=S.qs[S.i],a0=S.ans[S.i],lock=S.prac&&a0>=0;
  $('#prog').textContent=`${bn(S.i+1)}/${bn(S.qs.length)}`;
  $('#qb').innerHTML=`<button class="star">${S.st.has(S.i)?'⭐':'☆'}</button>${q.t?`<div class="mut">${esc(q.t)}</div>`:''}<div class="q">${esc(q.q)}</div>`+q.o.map((o,k)=>`<button class="opt${lock?(k==q.a?' ok':k==a0?' bad':''):a0===k?' sel':''}" data-k="${k}"><b>${lb(k)}</b><span>${esc(o)}</span></button>`).join('')+(lock&&q.e?`<div class="mut">💡 ${esc(q.e)}</div>`:'');
  $('#prev').disabled=S.i==0;$('#next').disabled=S.i==S.qs.length-1;
  $('#pal').innerHTML=S.qs.map((_,k)=>`<button class="pn${S.ans[k]>=0?' done':''}${k==S.i?' cur':''}" data-n="${k}">${bn(k+1)}</button>`).join('');
}
function finish(){
  if(S.done)return;S.done=1;clearInterval(S.t);
  let c=0,w=0,s=0;const bad=[];
  S.qs.forEach((q,i)=>{const a=S.ans[i];if(a<0){s++;bad.push(q)}else if(a==q.a)c++;else{w++;bad.push(q)}});
  const n=S.qs.length,cut=S.prac?0:w*cfg.neg,sc=c-cut,f=x=>bn(+x.toFixed(2));
  S.bad=bad;track(c,sc,n);
  $('#result').innerHTML=`<div class="card score"><div class="mut">${T('score')}</div><div class="big">${f(sc)} / ${bn(n)}</div><div class="mut">${T('pct')(bn(Math.round(c/n*100)))}${cut?T('cut')(f(cut)):''}</div><div class="stats"><div>✅ ${T('c')}<br><b>${bn(c)}</b></div><div>❌ ${T('w')}<br><b>${bn(w)}</b></div><div>⏭ ${T('s')}<br><b>${bn(s)}</b></div></div></div>${subTbl()}
<div class="nav">${bad.length?`<button class="pri" data-act="wrong" style="margin:0">${T('aw')}</button>`:''}<button class="sec" data-act="again">${T('aa')}</button></div>
<button class="sec" data-act="new" style="width:100%;margin:10px 0">${T('nw')}</button><h3>${T('rv')}</h3>`+
  S.qs.map((q,i)=>{
    const a=S.ans[i],st=a<0?'':a==q.a?'c':'w';
    return `<div class="card rv ${st}"><div class="mut">${S.st.has(i)?'⭐ ':''}${bn(i+1)}. ${a<0?T('sk'):a==q.a?T('rt'):T('wr')}</div><div class="q" style="font-size:16px">${esc(q.q)}</div>`+
      q.o.map((o,k)=>`<div class="opt${k==q.a?' ok':k==a?' bad':''}"><b>${lb(k)}</b><span>${esc(o)}</span></div>`).join('')+
      (q.e?`<div class="mut">💡 ${esc(q.e)}</div>`:'')+'</div>';
  }).join('');
  show('result');
}

$('#src').oninput=upd;
$('#lg').onchange=e=>{lang=e.target.value;try{localStorage.setItem('em_lang',lang)}catch(x){}applyLang();upd();refresh()};
$('#smp').onclick=()=>{$('#src').value=T('sample');upd()};
$('#go').onclick=()=>{
  cfg={neg:+$('#neg').value};
  begin(prep(Q,$('#sq').checked,$('#so').checked),mins(Q.length),$('#md').value=='p');
};
$('#qb').onclick=e=>{
  if(e.target.closest('.star')){S.st.has(S.i)?S.st.delete(S.i):S.st.add(S.i);render();return}
  const b=e.target.closest('.opt');if(!b)return;const k=+b.dataset.k;
  if(S.prac){if(S.ans[S.i]>=0)return;S.ans[S.i]=k}else S.ans[S.i]=S.ans[S.i]===k?-1:k;
  render()};
$('#pal').onclick=e=>{const b=e.target.closest('.pn');if(!b)return;S.i=+b.dataset.n;render();$('#pal').classList.remove('on');scrollTo(0,0)};
$('#pt').onclick=()=>$('#pal').classList.toggle('on');
$('#prev').onclick=()=>{S.i--;render();scrollTo(0,0)};
$('#next').onclick=()=>{S.i++;render();scrollTo(0,0)};
$('#sub').onclick=()=>{
  const u=S.ans.filter(a=>a<0).length;
  $('#cft').textContent=u?T('un')(bn(u)):T('all');
  $('#cf').classList.remove('hide');
};
$('#no').onclick=()=>$('#cf').classList.add('hide');
$('#yes').onclick=finish;
$('#result').onclick=e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(a=='new'){show('setup');return}
  const base=a=='wrong'?S.bad:S.qs;
  begin(prep(base,$('#sq').checked,$('#so').checked),mins(base.length),S.prac);
};
const J={get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const sets=()=>J.get('em_sets',{});
function chart(h){
  const st=h.length>1?280/(h.length-1):0,pt=h.map((x,i)=>[10+i*st,80-x.p*.7]);
  return `<svg viewBox="0 0 300 90" width="100%" style="max-width:420px"><polyline fill="none" style="stroke:var(--acc)" stroke-width="2.5" points="${pt.map(p=>p.join(',')).join(' ')}"/>${pt.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" style="fill:var(--acc)"/>`).join('')}</svg>`;
}
function refresh(){
  const k=Object.keys(sets());
  $('#sl').innerHTML=k.length?k.map(x=>`<option>${esc(x)}</option>`).join(''):'<option value="">—</option>';
  const nb=J.get('em_nb',[]);
  $('#nb').textContent=`📒 ${T('nb')} (${bn(nb.length)})`;$('#nb').disabled=!nb.length;
  const h=J.get('em_h',[]).slice(-10);
  $('#hl').innerHTML=h.length?chart(h)+h.slice().reverse().map(x=>`<div class="hr"><span>${new Date(x.d).toLocaleDateString(lang=='bn'?'bn-BD':'en-GB')}</span><b>${bn(x.s)}/${bn(x.n)}</b><span>${bn(x.p)}%</span></div>`).join(''):`<div class="mut">${T('noh')}</div>`;
}
function subTbl(){
  const g={};S.qs.forEach((q,i)=>{if(!q.t)return;const x=g[q.t]=g[q.t]||[0,0];x[1]++;if(S.ans[i]==q.a)x[0]++});
  const k=Object.keys(g);if(!k.length)return '';
  return `<div class="card"><b>${T('subj')}</b>`+k.map(t=>{const [a,b]=g[t],p=Math.round(a/b*100);return `<div class="hr"><span>${esc(t)}</span><span>${bn(a)}/${bn(b)}</span><b>${bn(p)}%</b></div><div class="pb"><i style="width:${p}%"></i></div>`}).join('')+'</div>';
}
function track(c,sc,n){
  const m=new Map(J.get('em_nb',[]).map(x=>[x.q,x]));
  S.qs.forEach((q,i)=>{
    const ok=S.ans[i]==q.a,x=m.get(q.q),star=S.st.has(i);
    if(!ok||star){if(!ok||!x)m.set(q.q,{q:q.q,o:q.o,a:q.a,e:q.e,t:q.t,k:0})}
    else if(x){x.k=(x.k||0)+1;if(x.k>=2)m.delete(q.q)}
  });
  J.set('em_nb',[...m.values()]);
  if(!S.prac){const h=J.get('em_h',[]);h.push({d:Date.now(),s:+sc.toFixed(2),n,p:Math.round(c/n*100)});J.set('em_h',h.slice(-50))}
}
$('#sv').onclick=()=>{const n=$('#nm').value.trim(),v=$('#src').value;if(!n||!v.trim())return;const s=sets();s[n]=v;J.set('em_sets',s);$('#nm').value='';refresh();$('#sl').value=n};
$('#ld').onclick=()=>{const s=sets(),k=$('#sl').value;if(k in s){$('#src').value=s[k];upd()}};
$('#dl').onclick=e=>{
  const b=e.target;
  if(!b.dataset.c){b.dataset.c=1;b.textContent=T('sure');setTimeout(()=>{delete b.dataset.c;b.textContent=T('del')},3000);return}
  delete b.dataset.c;b.textContent=T('del');const s=sets();delete s[$('#sl').value];J.set('em_sets',s);refresh();
};
$('#fl').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#src').value=r.result;upd()};r.readAsText(f);e.target.value=''};
$('#nb').onclick=()=>{const nb=J.get('em_nb',[]);if(!nb.length)return;cfg={neg:+$('#neg').value};begin(prep(nb,$('#sq').checked,$('#so').checked),mins(nb.length),$('#md').value=='p')};
$('#mk').onclick=()=>{const v=JSON.stringify({s:sets(),n:J.get('em_nb',[]),h:J.get('em_h',[])});$('#bk').value=v;$('#bk').select();try{navigator.clipboard.writeText(v)}catch(e){}};
$('#rs').onclick=()=>{try{const d=JSON.parse($('#bk').value);if(d.s)J.set('em_sets',{...sets(),...d.s});if(d.n)J.set('em_nb',d.n);if(d.h)J.set('em_h',d.h);refresh();$('#bk').value=''}catch(e){$('#bk').value='⚠️'}};
let z=+J.get('em_z',1);const setZ=()=>{document.documentElement.style.setProperty('--z',z);J.set('em_z',z)};
$('#fm').onclick=()=>{z=Math.max(.8,+(z-.1).toFixed(1));setZ()};
$('#fp').onclick=()=>{z=Math.min(1.5,+(z+.1).toFixed(1));setZ()};
const th0=J.get('em_th','');if(th0)document.documentElement.dataset.theme=th0;
$('#th').onclick=()=>{const r=document.documentElement,d=r.dataset.theme?r.dataset.theme=='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=d?'light':'dark';J.set('em_th',r.dataset.theme)};
setZ();
function tab(i){document.querySelectorAll('.tab').forEach((e,k)=>e.classList.toggle('hide',k!=i));document.querySelectorAll('#nav button').forEach((b,k)=>b.classList.toggle('on',k==i));scrollTo(0,0)}
$('#nav').onclick=e=>{const b=e.target.closest('button');if(b)tab(+b.dataset.tab)};
function mins(n){const v=parseFloat($('#min').value),m=$('#tmm').value;return m=='n'?0:m=='q'?(v||60)*n/60:(v||n)}
function phMin(){const m=$('#tmm').value,n=Q.length;$('#min').placeholder=m=='n'?'—':m=='q'?bn(60)+' ('+T('sec')+')':(n?bn(n):'')+' ('+T('auto')+')';$('#min').disabled=m=='n'}
function saveCfg(){J.set('em_cfg',{tmm:$('#tmm').value,min:$('#min').value,neg:$('#neg').value,md:$('#md').value,sq:$('#sq').checked,so:$('#so').checked})}
function loadCfg(){const c=J.get('em_cfg',null);if(!c)return;$('#tmm').value=c.tmm;$('#min').value=c.min;$('#neg').value=c.neg;$('#md').value=c.md;$('#sq').checked=c.sq;$('#so').checked=c.so}
document.addEventListener('change',saveCfg);$('#min').addEventListener('input',saveCfg);$('#tmm').addEventListener('change',phMin);
const CUR=()=>Math.max(EMV,+(localStorage.getItem('em_ver')||0));
async function chk(manual){
  const u=($('#ur').value||'').trim(),o=$('#us');
  if(!u){if(manual)o.textContent=T('uno');return}
  if(manual)o.textContent='…';
  try{
    const r=await fetch(u,{cache:'no-store'}),t=await r.text(),m=t.match(/var EMV=(\d+)/);
    if(!r.ok||!m||!/<\/html>\s*$/i.test(t))throw 0;
    const v=+m[1];
    if(v>CUR()){localStorage.setItem('em_app',t);localStorage.setItem('em_ver',v);$('#ub').classList.remove('hide');o.textContent=T('unew')+' (v'+v+')'}
    else if(manual)o.textContent=T('ulat')+' (v'+CUR()+')';
  }catch(e){if(manual)o.textContent=T('uerr')}
}
$('#uc').onclick=()=>chk(true);
$('#ub').onclick=()=>location.reload();
$('#uz').onclick=()=>{try{localStorage.removeItem('em_app');localStorage.removeItem('em_ver')}catch(e){}location.reload()};
$('#ur').value=J.get('em_url','');$('#ur').oninput=()=>J.set('em_url',$('#ur').value);
$('#src').value=ls.get();applyLang();loadCfg();upd();refresh();tab(0);
setTimeout(()=>{if(navigator.onLine!==false)chk(false)},1500);
})();
</script>
</body>
